aid: dandy
name: Dandy
description: >-
  Dandy is a digital dental lab platform for dentists, dental practices, and
  dental service organizations (DSOs). It combines intraoral scanner hardware,
  cloud-based case management software, and in-house dental lab manufacturing
  into a single scan-to-lab workflow. Dentists capture digital impressions with
  a Dandy intraoral scanner, submit cases through Dandy software, collaborate in
  real time with lab technicians via chat, video, and chairside scan review, and
  receive finished restorations manufactured by Dandy. Product lines include
  crowns, bridges, implants, clear aligners, retainers, dentures, night guards,
  splints, and sleep apnea devices. Dandy positions itself as an AI-powered
  digital dental lab modernizing restorative and orthodontic dentistry. It was
  surfaced as a portfolio company of General Catalyst and added to the API
  Evangelist network; the company publishes an agent-facing llms.txt and
  ai-index.json but does not currently expose a public developer API.
